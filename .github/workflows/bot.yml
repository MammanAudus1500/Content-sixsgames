name: SixsContent Bot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  run-bot:

    name: Complete SixsContent Video Pipeline

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # FFMPEG
      # ======================================================

      - name: Install FFmpeg
        run: |

          sudo apt-get update

          sudo apt-get install -y ffmpeg


      # ======================================================
      # PYTHON PACKAGES
      # ======================================================

      - name: Install Python packages
        run: |

          python -m pip install --upgrade pip

          pip install \
            google-genai \
            requests \
            edge-tts


      # ======================================================
      # RUN COMPLETE BOT
      # ======================================================

      - name: Run SixsContent
        env:

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

        run: |

          python bot.py
