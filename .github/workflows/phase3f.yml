name: SixsContent Phase 3F

on:
  workflow_dispatch:

jobs:
  phase3f:
    name: Final Content Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Install Python packages
        run: |
          pip install requests pillow

      - name: Download Phase 3E artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          import requests
          import zipfile
          import io

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json"
          }

          print("=" * 60)
          print("SIXSCONTENT — PHASE 3F")
          print("DOWNLOADING LATEST PHASE 3E ARTIFACT")
          print("=" * 60)

          url = f"https://api.github.com/repos/{repo}/actions/artifacts?per_page=100"

          response = requests.get(url, headers=headers, timeout=30)
          response.raise_for_status()

          artifacts = response.json()["artifacts"]

          matching = [
              a for a in artifacts
              if a["name"] == "phase3e-final-video.zip"
              and not a.get("expired", False)
          ]

          if not matching:
              raise RuntimeError(
                  "No usable phase3e-final-video.zip artifact was found."
              )

          matching.sort(
              key=lambda x: x.get("created_at", ""),
              reverse=True
          )

          artifact = matching[0]

          print(f"✅ Found artifact:")
          print(f"   Name: {artifact['name']}")
          print(f"   ID: {artifact['id']}")
          print(f"   Created: {artifact['created_at']}")

          download_url = artifact["archive_download_url"]

          download = requests.get(
              download_url,
              headers=headers,
              timeout=120
          )

          download.raise_for_status()

          os.makedirs("phase3f_input", exist_ok=True)

          with zipfile.ZipFile(io.BytesIO(download.content)) as z:
              z.extractall("phase3f_input")

          print("✅ Phase 3E artifact extracted.")

          for root, dirs, files in os.walk("phase3f_input"):
              for file in files:
                  print(" -", os.path.join(root, file))
          PY

      - name: Run Phase 3F
        run: |
          python phase3f_test.py

      - name: Upload Phase 3F package
        uses: actions/upload-artifact@v4
        with:
          name: phase3f-content-package
          path: phase3f_output/
          if-no-files-found: error
          retention-days: 7
