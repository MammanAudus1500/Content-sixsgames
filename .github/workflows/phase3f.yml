name: SixsContent Phase 3F

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  phase3f:
    name: Final Content Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Install Python packages
        run: |
          pip install requests pillow

      - name: Download latest successful Phase 3E artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import sys
          import time
          import zipfile
          import requests
          from pathlib import Path

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          print("=" * 60)
          print("SIXSCONTENT — PHASE 3F")
          print("DOWNLOADING LATEST SUCCESSFUL PHASE 3E ARTIFACT")
          print("=" * 60)

          # Get recent workflow runs.
          runs_url = (
              f"https://api.github.com/repos/{repo}/actions/workflows/"
              "phase3e.yml/runs"
          )

          response = requests.get(
              runs_url,
              headers=headers,
              params={
                  "status": "success",
                  "per_page": 20
              },
              timeout=30
          )

          if response.status_code != 200:
              print("❌ Could not query Phase 3E workflow.")
              print(response.status_code)
              print(response.text)
              sys.exit(1)

          runs = response.json().get("workflow_runs", [])

          if not runs:
              print("❌ No successful Phase 3E workflow runs found.")
              sys.exit(1)

          artifact = None

          # Search newest successful runs first.
          for run in runs:
              run_id = run["id"]

              print(f"🔎 Checking Phase 3E run {run_id}...")

              artifacts_url = (
                  f"https://api.github.com/repos/{repo}/actions/runs/"
                  f"{run_id}/artifacts"
              )

              ar = requests.get(
                  artifacts_url,
                  headers=headers,
                  params={"per_page": 100},
                  timeout=30
              )

              if ar.status_code != 200:
                  print(f"   ⚠️ Could not inspect run {run_id}.")
                  continue

              artifacts = ar.json().get("artifacts", [])

              for item in artifacts:
                  name = item.get("name", "")
                  expired = item.get("expired", False)

                  print(f"   Artifact: {name}")

                  if (
                      name == "phase3e-final-video"
                      and not expired
                  ):
                      artifact = item
                      break

              if artifact:
                  break

          if not artifact:
              print("❌ No usable phase3e-final-video artifact was found.")
              sys.exit(1)

          artifact_id = artifact["id"]
          artifact_name = artifact["name"]

          print(f"✅ Found artifact: {artifact_name}")
          print(f"✅ Artifact ID: {artifact_id}")

          download_url = (
              f"https://api.github.com/repos/{repo}/actions/artifacts/"
              f"{artifact_id}/zip"
          )

          print("⬇️ Downloading artifact...")

          r = requests.get(
              download_url,
              headers=headers,
              timeout=120,
              allow_redirects=True
          )

          if r.status_code != 200:
              print("❌ Artifact download failed.")
              print("HTTP:", r.status_code)
              sys.exit(1)

          artifact_zip = Path("phase3e-final-video.zip")
          artifact_zip.write_bytes(r.content)

          print(
              f"✅ Artifact downloaded: "
              f"{artifact_zip.stat().st_size:,} bytes"
          )

          extract_dir = Path("phase3e_input")
          extract_dir.mkdir(exist_ok=True)

          with zipfile.ZipFile(artifact_zip, "r") as z:
              print("📦 Artifact contents:")
              for name in z.namelist():
                  print(" -", name)
              z.extractall(extract_dir)

          # Find the actual MP4 regardless of ZIP folder structure.
          videos = list(extract_dir.rglob("*.mp4"))

          if not videos:
              print("❌ No MP4 video found inside Phase 3E artifact.")
              sys.exit(1)

          # Prefer the known Phase 3E filename.
          preferred = [
              p for p in videos
              if p.name == "sixscontent_phase3e_final.mp4"
          ]

          source = preferred[0] if preferred else videos[0]

          output_dir = Path("phase3f_input")
          output_dir.mkdir(exist_ok=True)

          destination = output_dir / "sixscontent_phase3e_final.mp4"

          destination.write_bytes(source.read_bytes())

          print(
              f"✅ Ready for Phase 3F: {destination}"
          )
          print(
              f"💾 Size: {destination.stat().st_size:,} bytes"
          )
          PY

      - name: Run Phase 3F
        run: |
          python phase3f_test.py

      - name: Upload Phase 3F final package
        uses: actions/upload-artifact@v4
        with:
          name: phase3f-final-package
          path: phase3f_output/
          if-no-files-found: error
          retention-days: 7
