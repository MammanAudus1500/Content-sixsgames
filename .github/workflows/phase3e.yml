name: SixsContent Phase 3E

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  phase3e:
    name: Voice Over + Captions
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests edge-tts

      - name: Run Phase 3E
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python phase3e_test.py

      - name: Upload Phase 3E final video
        uses: actions/upload-artifact@v4
        with:
          name: phase3e-final-video
          path: |
            phase3e_output/sixscontent_phase3e_final.mp4
            phase3e_output/voiceover.mp3
            phase3e_output/captions.srt
            phase3e_output/script.txt
          if-no-files-found: error
          retention-days: 7
