name: SixsContent Phase 3E

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  phase3e:
    name: Voice Over + Captions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts requests

      - name: Download latest Phase 3D-2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import requests
          import zipfile
          import io
          import sys

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          url = f"https://api.github.com/repos/{repo}/actions/runs"
          params = {
              "per_page": 100
          }

          print("🔎 Finding latest successful Phase 3D-2 run...")

          response = requests.get(url, headers=headers, params=params, timeout=30)
          response.raise_for_status()

          runs = response.json().get("workflow_runs", [])

          candidates = [
              run for run in runs
              if run.get("name") == "SixsContent Phase 3D-2"
              and run.get("conclusion") == "success"
          ]

          if not candidates:
              print("❌ No successful Phase 3D-2 run was found.")
              sys.exit(1)

          candidates.sort(
              key=lambda x: x.get("created_at", ""),
              reverse=True
          )

          selected = candidates[0]

          print(f"✅ Found Phase 3D-2 run:")
          print(f"   Run ID: {selected['id']}")
          print(f"   Created: {selected['created_at']}")

          artifacts_url = selected["artifacts_url"]

          artifact_response = requests.get(
              artifacts_url,
              headers=headers,
              timeout=30
          )
          artifact_response.raise_for_status()

          artifacts = artifact_response.json().get("artifacts", [])

          target = None

          for artifact in artifacts:
              name = artifact.get("name", "")
              if name == "phase3d2-video":
                  target = artifact
                  break

          if target is None:
              print("❌ Artifact 'phase3d2-video' was not found.")
              print("Available artifacts:")
              for artifact in artifacts:
                  print(" -", artifact.get("name"))
              sys.exit(1)

          print(f"✅ Found artifact: {target['name']}")
          print(f"   Size: {target.get('size_in_bytes', 0)} bytes")

          download_url = target["archive_download_url"]

          download_response = requests.get(
              download_url,
              headers=headers,
              timeout=300
          )
          download_response.raise_for_status()

          os.makedirs("phase3d2_input", exist_ok=True)

          with zipfile.ZipFile(io.BytesIO(download_response.content)) as z:
              z.extractall("phase3d2_input")

          print("✅ Phase 3D-2 artifact downloaded and extracted.")

          found = []

          for root, dirs, files in os.walk("phase3d2_input"):
              for file in files:
                  if file.endswith(".mp4"):
                      path = os.path.join(root, file)
                      found.append(path)

          if not found:
              print("❌ No MP4 file was found inside the artifact.")
              sys.exit(1)

          print("🎬 MP4 files found:")
          for path in found:
              print(" -", path)

          source = None

          for path in found:
              if path.endswith("sixscontent_phase3d2.mp4"):
                  source = path
                  break

          if source is None:
              source = found[0]

          os.makedirs("phase3d2_output", exist_ok=True)

          destination = "phase3d2_output/sixscontent_phase3d2.mp4"

          with open(source, "rb") as src, open(destination, "wb") as dst:
              while True:
                  chunk = src.read(1024 * 1024)
                  if not chunk:
                      break
                  dst.write(chunk)

          print(f"✅ Ready for Phase 3E: {destination}")

          PY

      - name: Run Phase 3E
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python phase3e_test.py

      - name: Upload Phase 3E final video
        uses: actions/upload-artifact@v4
        with:
          name: phase3e-final-video
          path: phase3e_output/
          if-no-files-found: error
          retention-days: 7
