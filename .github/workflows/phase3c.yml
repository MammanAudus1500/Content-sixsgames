name: SixsContent Phase 3C

on:
  workflow_dispatch:

jobs:
  phase3c:
    name: Collect Pexels Videos
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Phase 3C
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python phase3c_test.py

      - name: Upload Pexels videos
        uses: actions/upload-artifact@v4
        with:
          name: phase3c-videos
          path: phase3c_videos/
          retention-days: 1
